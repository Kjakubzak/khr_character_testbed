# GitHub Actions CI for the KHR Character sandbox.
#
# Four merge gates (see docs/ci.md):
#   1. Compile clean         — implicit in the game-ci test run (a compile error fails the run).
#   2. Tests green + floor    — PlayMode tests pass AND total >= floor (anti "0 tests = false green").
#   3. glTF-Validator         — 0 errors on every exported GLB (no Unity needed). REPORT-ONLY for now: see the job.
#   4. Round-trip goldens     — no un-acknowledged change to the normalized wire snapshot.
#
# Render-pipeline matrix: Built-in is the REQUIRED gate; URP is a non-blocking nightly axis (TODO at the bottom).
# The KHR test / glTF-validation / golden gates are RP-agnostic (they decode/validate the wire), so they run on
# the Built-in cell and pass identically anywhere.
#
# SETUP (one-time): add a repository secret `UNITY_LICENSE` containing a Unity *Personal* license file (.ulf).
# Activate locally once with game-ci's request/activation flow, then paste the .ulf contents into the secret.
# See https://game.ci/docs/github/activation and docs/ci.md.

name: CI

on:
  push:
    branches: [main, master, unity-2022]
  pull_request:
  workflow_dispatch:

# Never cancel a running workflow: a cancelled Unity job can skip returning its licence activation. Every Unity job
# also joins the repo-wide `unity-licence` group (here and in ci-nightly.yml), so only one holds a seat at a time.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

env:
  UNITY_VERSION: "2022.2.23f1"
  # Only the testbed's own tests run in this consumer (Unity 'testables' does not surface a git-package's
  # tests); the floor tracks the sandbox suite. The plugin's own tests run in the plugin-tests job (embedded copy).
  # TODO(floors from Stage 3.7): replace these placeholder floors with the counts from the Stage 3.7 evidence.
  MIN_TESTS: "120"
  MIN_SANDBOX_TESTS: "120"
  MIN_PLUGIN_TESTS: "766"
  MIN_CONFORMANCE_TESTS: "0"
  # game-ci/unity-test-runner@v4 downloads the game-ci CLI release named here (its default is `latest`).
  GAME_CI_CLI_VERSION: "v0.1.72"

jobs:
  # Doc-drift lint (no Unity): fail fast if any Unity version string in the docs/workflows disagrees with
  # ProjectSettings/ProjectVersion.txt (the single source of truth). Cheap guard against the README/docs
  # advertising an editor version the project doesn't actually use.
  doc-version-lint:
    name: Doc version lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check docs Unity version == ProjectVersion.txt
        run: bash ./Tools/ci/check-docs-version.sh

  # Package-resolution preflight (no Unity): the project pins UnityGLTF to a personal fork by commit SHA (a
  # single point of failure). Fail fast — before burning Unity CI minutes on a doomed UPM resolve — if that pin
  # is unreachable, the SHA was force-pushed away, or manifest/lock/README have drifted out of agreement.
  package-pin-preflight:
    name: Package pin preflight
    runs-on: ubuntu-latest
    outputs:
      unity-licence: ${{ steps.unity-licence.outputs.available }}
    steps:
      # `secrets` is not readable in a job-level `if:`, so the Unity jobs gate on this output. It runs first so the
      # output is set even when the pin check below fails.
      - name: Detect Unity licence secrets
        id: unity-licence
        env:
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
        run: |
          if [ -n "$UNITY_EMAIL" ] || [ -n "$UNITY_LICENSE" ] || [ -n "$UNITY_SERIAL" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
      - name: Check pinned UnityGLTF fork is reachable + consistent
        run: bash ./Tools/ci/check-package-pin.sh

  # Without licence secrets the Unity jobs are skipped (not failed), so the other gates stay readable; this one
  # check carries the red.
  unity-licence-missing:
    name: Unity licence missing
    needs: package-pin-preflight
    if: ${{ !cancelled() && needs.package-pin-preflight.outputs.unity-licence == 'false' }}
    runs-on: ubuntu-24.04
    steps:
      - name: Fail with the missing-secrets reason
        run: |
          echo "::error title=Unity licence missing::None of UNITY_EMAIL, UNITY_LICENSE or UNITY_SERIAL is set, so every Unity job was skipped. Add the secrets for your licence type (docs/ci.md)."
          exit 1

  # License-compliance lint (no Unity): every committed Assets/SampleAssets/**/*.glb must have a provenance row
  # in ATTRIBUTION.md (source + SPDX). Matters for a public repo whose hero + variants are non-commercial VRM.
  attribution-check:
    name: Attribution check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check every committed .glb has an ATTRIBUTION.md row
        run: bash ./Tools/ci/check-attribution.sh

  # GATE 1 (compile) + GATE 2 (tests + min-test-count floor). Built-in RP, required.
  tests:
    name: Tests (Unity 2022.2.23f1, Built-in)
    needs: package-pin-preflight
    runs-on: ubuntu-24.04
    if: needs.package-pin-preflight.outputs.unity-licence == 'true'
    concurrency:
      group: unity-licence
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      # LFS objects come from a cache keyed on the pointer list: this repo is not a fork, so every LFS download is
      # billed to the owner's quota.
      - name: Hash the LFS object list
        id: lfs
        run: echo "key=lfs-$(git lfs ls-files --long | cut -d' ' -f1 | sort | sha256sum | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
      - name: Cache LFS objects
        uses: actions/cache@v4
        with:
          path: .git/lfs
          key: ${{ steps.lfs.outputs.key }}
      - name: Pull LFS objects
        run: git lfs pull

      # Library cache keyed on the dependency fingerprint: manifest + the resolved package SHA in packages-lock
      # + the editor version. A new/force-pushed dependency commit changes packages-lock and busts the cache.
      - name: Cache Library
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-${{ env.UNITY_VERSION }}-builtin-${{ hashFiles('Packages/manifest.json', 'Packages/packages-lock.json', 'ProjectSettings/ProjectVersion.txt') }}
          restore-keys: |
            Library-${{ env.UNITY_VERSION }}-builtin-

      - name: Run EditMode + PlayMode tests (game-ci)
        uses: game-ci/unity-test-runner@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
        with:
          unityVersion: ${{ env.UNITY_VERSION }}
          testMode: all
          cliVersion: ${{ env.GAME_CI_CLI_VERSION }}
          coverageEnabled: false
          artifactsPath: artifacts/test-results
          githubToken: ${{ secrets.GITHUB_TOKEN }}
          # No -nographics here: game-ci provides an xvfb display, so this also supports future demo-render tests.
          # (The local Tools/ci scripts use -nographics for the wire-only suite.)

      # GATE 2 floor: only the testbed's own tests run here (Unity 'testables' does not surface a git-package's
      # tests into a consumer), so the floor tracks the sandbox suite. A hollow package resolve instead fails
      # GATE 1 compile (Sandbox.Tests links real plugin types); the plugin's tests run in the plugin-tests job.
      # `testMode: all` writes one XML per mode; the gate sums every one.
      - name: Enforce test gate + min-test-count floor
        if: always()
        run: >-
          python3 Tools/ci/check-test-results.py --results-dir artifacts/test-results --modes editmode,playmode
          --min-total "$MIN_TESTS" --min-sandbox "$MIN_SANDBOX_TESTS" --min-conformance "$MIN_CONFORMANCE_TESTS"
          --label "GATE 2"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: artifacts/test-results

  # GATE 3 (glTF-Validator) — validates all committed character corpora with the pinned proposal-aware fork.
  # Errors fail the gate. Informative warnings (including vendor material/extensions on the VRM examples) remain
  # in the uploaded reports. Keep the status name stable because branch protection matches it.
  gltf-validator:
    name: glTF-Validator
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Hash the LFS object list
        id: lfs
        run: echo "key=lfs-$(git lfs ls-files --long | cut -d' ' -f1 | sort | sha256sum | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
      - name: Cache LFS objects
        uses: actions/cache@v4
        with:
          path: .git/lfs
          key: ${{ steps.lfs.outputs.key }}
      - name: Pull LFS objects
        run: git lfs pull
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: "2.19.6"
      - uses: actions/checkout@v4
        with:
          repository: Kjakubzak/glTF-Validator
          ref: 99e8523cf548fe7780870270b1bd2fa60bab6ba2
          path: .gltf-validator
      - name: Build pinned proposal-aware glTF-Validator
        run: |
          cd .gltf-validator
          dart pub get
          dart run grinder exe
          sudo apt-get update && sudo apt-get install -y jq
      - name: Validate Synthetic (numErrors == 0)
        env:
          GLTF_VALIDATOR: ${{ github.workspace }}/.gltf-validator/build/bin/gltf_validator
        run: bash ./Tools/ci/validate-glb.sh --input-dir Assets/SampleAssets/Synthetic --report-dir Artifacts/reports/Synthetic --required
      - name: Validate FromBlender (numErrors == 0)
        env:
          GLTF_VALIDATOR: ${{ github.workspace }}/.gltf-validator/build/bin/gltf_validator
        run: bash ./Tools/ci/validate-glb.sh --input-dir Assets/SampleAssets/FromBlender --report-dir Artifacts/reports/FromBlender --required
      - name: Validate VRM_KHR_Examples (numErrors == 0)
        env:
          GLTF_VALIDATOR: ${{ github.workspace }}/.gltf-validator/build/bin/gltf_validator
        run: bash ./Tools/ci/validate-glb.sh --input-dir Assets/SampleAssets/VRM_KHR_Examples --report-dir Artifacts/reports/VRM_KHR_Examples --required
      - name: Upload validator reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gltf-validator-reports
          path: Artifacts/reports

  # GATE 4 (round-trip goldens) — re-export + normalize the wire under Unity, then diff against committed goldens.
  goldens:
    name: Round-trip goldens
    runs-on: ubuntu-24.04
    needs: tests
    concurrency:
      group: unity-licence
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      # LFS objects come from a cache keyed on the pointer list: this repo is not a fork, so every LFS download is
      # billed to the owner's quota.
      - name: Hash the LFS object list
        id: lfs
        run: echo "key=lfs-$(git lfs ls-files --long | cut -d' ' -f1 | sort | sha256sum | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
      - name: Cache LFS objects
        uses: actions/cache@v4
        with:
          path: .git/lfs
          key: ${{ steps.lfs.outputs.key }}
      - name: Pull LFS objects
        run: git lfs pull
      - name: Cache Library
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-${{ env.UNITY_VERSION }}-builtin-${{ hashFiles('Packages/manifest.json', 'Packages/packages-lock.json', 'ProjectSettings/ProjectVersion.txt') }}
          restore-keys: |
            Library-${{ env.UNITY_VERSION }}-builtin-
      # NOTE: game-ci's unity-builder is used here only as a licensed headless Unity host that runs our
      # `-executeMethod` seam (buildMethod). SandboxCI.ExportGoldens writes Artifacts/snapshots/*.json. Depending
      # on your game-ci version you may instead activate a license + invoke Tools/ci/export-goldens.sh directly;
      # repo-architect owns final CI wiring. The gate itself (the diff below) is provider-agnostic.
      - name: Export normalized snapshots (SandboxCI.ExportGoldens)
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
        with:
          unityVersion: ${{ env.UNITY_VERSION }}
          targetPlatform: StandaloneLinux64
          buildMethod: Samples.Editor.SandboxCI.ExportGoldens
          allowDirtyBuild: true
      - name: Diff snapshots against committed goldens
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          goldens=(Tests/Golden/*.json)
          snapshots=(Artifacts/snapshots/*.json)
          if [ ${#goldens[@]} -eq 0 ]; then
            echo "No committed goldens — run Tools/ci/export-goldens.sh --update locally and commit."
            exit 1
          fi
          fail=0
          for g in "${goldens[@]}"; do
            s="Artifacts/snapshots/$(basename "$g")"
            if [ ! -f "$s" ]; then echo "MISSING snapshot $s"; fail=1; continue; fi
            if ! diff -u "$g" "$s"; then fail=1; fi
          done
          for s in "${snapshots[@]}"; do
            g="Tests/Golden/$(basename "$s")"
            if [ ! -f "$g" ]; then echo "MISSING committed golden $g"; fail=1; fi
          done
          if [ $fail -ne 0 ]; then echo "GATE 4 FAILED — wire drift. If intentional: Export-Goldens -Update + commit."; exit 1; fi
          echo "GATE 4 PASS."

  # The plugin's own suites: 'testables' does not surface tests from a git-pinned package, so this job embeds
  # UnityGLTF at the exact commit Packages/manifest.json pins and runs the whole project. It is chained after
  # goldens (and runs even when goldens fails) so only one Unity job per run waits on the `unity-licence` group:
  # GitHub cancels a second pending job in a group.
  plugin-tests:
    name: Plugin tests (embedded UnityGLTF)
    needs: [package-pin-preflight, goldens]
    if: ${{ !cancelled() && needs.package-pin-preflight.result == 'success' && needs.package-pin-preflight.outputs.unity-licence == 'true' }}
    runs-on: ubuntu-24.04
    concurrency:
      group: unity-licence
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      # LFS objects come from a cache keyed on the pointer list: this repo is not a fork, so every LFS download is
      # billed to the owner's quota.
      - name: Hash the LFS object list
        id: lfs
        run: echo "key=lfs-$(git lfs ls-files --long | cut -d' ' -f1 | sort | sha256sum | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
      - name: Cache LFS objects
        uses: actions/cache@v4
        with:
          path: .git/lfs
          key: ${{ steps.lfs.outputs.key }}
      - name: Pull LFS objects
        run: git lfs pull
      - name: Read the UnityGLTF pin from Packages/manifest.json
        id: pin
        run: |
          url="$(python3 -c 'import json; print(json.load(open("Packages/manifest.json"))["dependencies"]["org.khronos.unitygltf"])')"
          if [[ ! "$url" =~ ^https://github\.com/([^/]+/[^/#]+)#([0-9a-f]{40})$ ]]; then
            echo "::error::org.khronos.unitygltf is not a github.com URL pinned to a 40-hex commit: '$url'"; exit 1
          fi
          echo "repo=${BASH_REMATCH[1]%.git}" >> "$GITHUB_OUTPUT"
          echo "sha=${BASH_REMATCH[2]}" >> "$GITHUB_OUTPUT"
      # An embedded package (a folder under Packages/ with the same name) overrides the manifest's git entry.
      - name: Embed UnityGLTF at the pinned commit
        uses: actions/checkout@v4
        with:
          repository: ${{ steps.pin.outputs.repo }}
          ref: ${{ steps.pin.outputs.sha }}
          path: Packages/org.khronos.unitygltf
          persist-credentials: false
      - name: Confirm the embedded commit
        run: test "$(git -C Packages/org.khronos.unitygltf rev-parse HEAD)" = "${{ steps.pin.outputs.sha }}"
      # A separate key that includes the embedded SHA: the builtin key hashes packages-lock.json, which does not
      # change when the embedded copy does.
      - name: Cache Library (embedded UnityGLTF)
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-${{ env.UNITY_VERSION }}-plugin-${{ steps.pin.outputs.sha }}-${{ hashFiles('Packages/manifest.json', 'Packages/packages-lock.json', 'ProjectSettings/ProjectVersion.txt') }}
          restore-keys: |
            Library-${{ env.UNITY_VERSION }}-plugin-${{ steps.pin.outputs.sha }}-
      - name: Run EditMode + PlayMode tests with embedded UnityGLTF (game-ci)
        uses: game-ci/unity-test-runner@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
        with:
          unityVersion: ${{ env.UNITY_VERSION }}
          testMode: all
          cliVersion: ${{ env.GAME_CI_CLI_VERSION }}
          coverageEnabled: false
          artifactsPath: artifacts/plugin-test-results
          githubToken: ${{ secrets.GITHUB_TOKEN }}
          checkName: Plugin test results
      - name: Enforce plugin test gate + floor
        if: always()
        run: >-
          python3 Tools/ci/check-test-results.py --results-dir artifacts/plugin-test-results --modes editmode,playmode
          --min-total "$MIN_PLUGIN_TESTS" --min-sandbox "$MIN_SANDBOX_TESTS" --min-conformance "$MIN_CONFORMANCE_TESTS"
          --label "Plugin tests"
      - name: Upload plugin test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: plugin-test-results
          path: artifacts/plugin-test-results

  # ── TODO: URP nightly (non-blocking) ────────────────────────────────────────────────────────────────────────
  # Add a scheduled (cron) workflow or a matrix axis that runs the `tests` job against a URP-configured project
  # variant (Graphics Settings render pipeline asset + URP shaders in Always-Included). Keep it non-blocking:
  # `continue-on-error: true` or a separate nightly workflow. HDRP is deferred (limited UnityGLTF support).
