# Nightly CI for the KHR Character sandbox — NON-BLOCKING (optional polish; see docs/ci.md "Nightly").
#
# The per-push workflow (ci.yml) is the REQUIRED Built-in merge gate. This workflow never blocks a PR: it runs on a
# schedule (and manual dispatch) to (1) re-run the full PlayMode suite nightly to catch environment/dependency drift,
# and (2) host the URP render-pipeline axis.
#
# RP-agnostic note: the wire/state tests pass identically on any render pipeline, so URP's incremental value is
# proving the DEMO materials render under URP (what the demo-scene smoke tests' shader-clean check exercises). The
# synthetic SC-* materials are already pipeline-aware (SampleCharacterFactory.CreateSkinMaterial prefers URP Lit and
# falls back to Built-in Standard), so the remaining work for a true URP cell is purely project config (below).

name: CI Nightly

on:
  schedule:
    - cron: "0 7 * * *"   # 07:00 UTC daily
  workflow_dispatch:

env:
  UNITY_VERSION: "2022.2.23f1"
  MIN_TESTS: "120"
  MIN_SANDBOX_TESTS: "120"
  # Not a placeholder: 53 conformance cases + the count guard (EditMode, Sandbox.Conformance.Tests).
  MIN_CONFORMANCE_TESTS: "54"
  # TODO(floors from Stage 3.7): MIN_TESTS / MIN_SANDBOX_TESTS are placeholders; use the Stage 3.7 counts.
  # game-ci/unity-test-runner@v4 downloads the game-ci CLI release named here (its default is `latest`).
  GAME_CI_CLI_VERSION: "v0.1.72"

# checks: write lets game-ci's test runner post its results check; without it the step fails after the tests pass.
permissions:
  contents: read
  checks: write

jobs:
  # Package-resolution preflight (no Unity): the nightly's job is to catch environment/dependency drift, and a
  # personal-fork pin by SHA is the most likely thing to rot. Fail fast if the pinned UnityGLTF fork is
  # unreachable, the SHA was force-pushed away, or manifest/lock/README have drifted out of agreement.
  package-pin-preflight:
    name: Package pin preflight
    runs-on: ubuntu-latest
    outputs:
      unity-licence: ${{ steps.unity-licence.outputs.available }}
      unity-licence-missing: ${{ steps.unity-licence.outputs.missing }}
    steps:
      # `secrets` is not readable in a job-level `if:`, so the Unity jobs gate on this output. It runs first so the
      # output is set even when the pin check below fails. The accepted sets are the ones unity-builder (goldens, URP
      # activation) accepts; the test runner accepts a superset. Only secret names are ever printed.
      - name: Detect Unity licence secrets
        id: unity-licence
        env:
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_LICENSING_SERVER: ${{ vars.UNITY_LICENSING_SERVER }}
        run: |
          if [ -n "$UNITY_LICENSING_SERVER" ]; then
            available=true
          elif [ -n "$UNITY_EMAIL" ] && [ -n "$UNITY_PASSWORD" ] && [ -n "$UNITY_SERIAL$UNITY_LICENSE" ]; then
            available=true
          else
            available=false
            missing=""
            [ -n "$UNITY_EMAIL" ] || missing="$missing UNITY_EMAIL"
            [ -n "$UNITY_PASSWORD" ] || missing="$missing UNITY_PASSWORD"
            [ -n "$UNITY_SERIAL$UNITY_LICENSE" ] || missing="$missing UNITY_SERIAL-or-UNITY_LICENSE"
            echo "missing=${missing# }" >> "$GITHUB_OUTPUT"
          fi
          echo "available=$available" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
      - name: Check pinned UnityGLTF fork is reachable + consistent
        run: bash ./Tools/ci/check-package-pin.sh

  # Without licence secrets the Unity jobs are skipped (not failed); this one check carries the red.
  unity-licence-missing:
    name: Unity licence missing
    needs: package-pin-preflight
    if: ${{ !cancelled() && needs.package-pin-preflight.outputs.unity-licence == 'false' }}
    runs-on: ubuntu-24.04
    steps:
      - name: Fail with the missing-secrets reason
        env:
          MISSING: ${{ needs.package-pin-preflight.outputs.unity-licence-missing }}
        run: |
          echo "::error title=Unity licence missing::Every Unity job was skipped. Missing: ${MISSING}. Set the repository variable UNITY_LICENSING_SERVER, or the secrets UNITY_EMAIL + UNITY_PASSWORD + (UNITY_SERIAL or UNITY_LICENSE); see docs/ci.md."
          exit 1

  # Built-in nightly: the same PlayMode suite as the required gate, on a schedule (drift detection). Non-blocking
  # by virtue of being a scheduled workflow that no branch protection depends on.
  nightly-builtin:
    name: Nightly tests (Built-in)
    needs: package-pin-preflight
    runs-on: ubuntu-24.04
    if: needs.package-pin-preflight.outputs.unity-licence == 'true'
    timeout-minutes: 60
    concurrency:
      group: unity-licence
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/lfs-pull-cached
      - name: Cache Library
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-${{ env.UNITY_VERSION }}-builtin-${{ hashFiles('Packages/manifest.json', 'Packages/packages-lock.json', 'ProjectSettings/ProjectVersion.txt') }}
          restore-keys: |
            Library-${{ env.UNITY_VERSION }}-builtin-
      - name: Run EditMode + PlayMode tests (game-ci)
        uses: game-ci/unity-test-runner@32e57712352b500e17974b245a6dce9e11a73213 # v4 (v4.4.0)
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
        with:
          unityVersion: ${{ env.UNITY_VERSION }}
          unityLicensingServer: ${{ vars.UNITY_LICENSING_SERVER }}
          testMode: all
          customParameters: -testCategory !Graphics
          cliVersion: ${{ env.GAME_CI_CLI_VERSION }}
          coverageEnabled: false
          artifactsPath: artifacts/test-results
          githubToken: ${{ secrets.GITHUB_TOKEN }}
      - name: Enforce test gate + floor
        if: always()
        run: >-
          python3 Tools/ci/check-test-results.py --results-dir artifacts/test-results --modes editmode,playmode
          --min-total "$MIN_TESTS" --min-sandbox "$MIN_SANDBOX_TESTS" --min-conformance "$MIN_CONFORMANCE_TESTS"
          --label "Nightly (Built-in)"
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nightly-test-results
          path: artifacts/test-results

  # ── URP axis (non-blocking) ───────────────────────────────────────────────────────────────────────────────────
  # continue-on-error: a URP-only issue surfaces as a signal, never reds the nightly. The cell ACTIVATES the committed
  # URP pipeline asset (Assets/Settings/URP) via SandboxCI.ActivateUrp - which writes ProjectSettings/GraphicsSettings
  # - then runs the full PlayMode suite under URP. game-ci provides an xvfb display (NOT -nographics), so URP renders;
  # materials follow the active pipeline (Samples.Shared.RenderPipelineUtil), so the demo-scene smoke tests exercise
  # URP shader-clean boot. The committed project default stays Built-in (this activation is per-run / ephemeral).
  nightly-urp:
    name: Nightly tests (URP)
    # Chained after the Built-in cell (and runs even when it fails) so only one Unity job per run waits on the
    # `unity-licence` group: GitHub cancels a second pending job in a group.
    needs: [package-pin-preflight, nightly-builtin]
    if: ${{ !cancelled() && needs.package-pin-preflight.result == 'success' && needs.package-pin-preflight.outputs.unity-licence == 'true' }}
    runs-on: ubuntu-24.04
    continue-on-error: true
    timeout-minutes: 90
    concurrency:
      group: unity-licence
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/lfs-pull-cached
      - name: Cache Library (URP)
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-${{ env.UNITY_VERSION }}-urp-${{ hashFiles('Packages/manifest.json', 'Packages/packages-lock.json', 'ProjectSettings/ProjectVersion.txt') }}
          restore-keys: |
            Library-${{ env.UNITY_VERSION }}-urp-
      # Step 1: activate URP (persists GraphicsSettings.defaultRenderPipeline to the committed URP asset). unity-builder
      # is used purely as a licensed headless host for the -executeMethod seam (mirrors the golden job); allowDirtyBuild
      # since we don't produce a player. The change is written to disk for the test step to read.
      - name: Activate URP (SandboxCI.ActivateUrp)
        uses: game-ci/unity-builder@4423ee75828dff56037d1d1cfdac6b68e3a6ba00 # v4 (v4.8.2)
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
        with:
          unityVersion: ${{ env.UNITY_VERSION }}
          unityLicensingServer: ${{ vars.UNITY_LICENSING_SERVER }}
          targetPlatform: StandaloneLinux64
          buildMethod: Samples.Editor.SandboxCI.ActivateUrp
          allowDirtyBuild: true
      # Step 2: run the PlayMode suite under the now-active URP pipeline (xvfb display, no -nographics).
      - name: Run PlayMode tests under URP (game-ci)
        uses: game-ci/unity-test-runner@32e57712352b500e17974b245a6dce9e11a73213 # v4 (v4.4.0)
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
        with:
          unityVersion: ${{ env.UNITY_VERSION }}
          unityLicensingServer: ${{ vars.UNITY_LICENSING_SERVER }}
          testMode: playmode
          cliVersion: ${{ env.GAME_CI_CLI_VERSION }}
          coverageEnabled: false
          artifactsPath: artifacts/test-results-urp
          githubToken: ${{ secrets.GITHUB_TOKEN }}
      - name: Upload URP test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nightly-urp-test-results
          path: artifacts/test-results-urp
